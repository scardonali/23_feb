<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Calculadora</h1>
    <h2>Santiago cardona</h2>
        <input type="number" id="num1" placeholder="Número 1" onchange="operacion()" >
        <input type="number" id="num2" placeholder="Número 2" onchange="operacion()">    
        <select  id="operacion" onchange="operacion(this.value)">
            <option value="suma">Suma</option>
            <option value="resta">Resta</option>
            <option value="multiplicacion">Multplicacion</option>
            <option value="division">División</option>
        </select>
        <br>

        <div>
            <input type="text" id="fecha" placeholder="Indique su año de nacimiento" onchange="nacimiento()">
        </div>
        <br>

        <div>
            <input type="text" name="" id="retiro" placeholder="Valor a Retirar">
            <button type="button" id="" onclick="retirar()">retirar</button>
        </div>

    <script src="archivo.js"></script>
</body>
</html>
